<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Smart Shift Management — שיבוץ משמרות חכם לצוותי אבטחה. אלגוריתם שמכבד זמינות, שעות מנוחה והוגנות עומס, עם הסבר לכל החלטה."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- The shift ring, inlined so the tab icon needs no extra request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cg transform='rotate(-90 24 24)' fill='none' stroke-width='5' stroke-linecap='round'%3E%3Ccircle cx='24' cy='24' r='18' pathLength='120' stroke-dasharray='6.6 113.4' stroke='%233B82F6' opacity='.45'/%3E%3Ccircle cx='24' cy='24' r='18' pathLength='120' stroke-dasharray='6.6 113.4' stroke-dashoffset='-20' stroke='%233B82F6' opacity='.45'/%3E%3Ccircle cx='24' cy='24' r='18' pathLength='120' stroke-dasharray='6.6 113.4' stroke-dashoffset='-40' stroke='%233B82F6' opacity='.45'/%3E%3Ccircle cx='24' cy='24' r='18' pathLength='120' stroke-dasharray='6.6 113.4' stroke-dashoffset='-60' stroke='%233B82F6' opacity='.45'/%3E%3Ccircle cx='24' cy='24' r='18' pathLength='120' stroke-dasharray='6.6 113.4' stroke-dashoffset='-90' stroke='%2334D399'/%3E%3Ccircle cx='24' cy='24' r='18' pathLength='120' stroke-dasharray='6.6 113.4' stroke-dashoffset='-100' stroke='%2334D399'/%3E%3Ccircle cx='24' cy='24' r='18' pathLength='120' stroke-dasharray='6.6 113.4' stroke-dashoffset='-110' stroke='%2334D399'/%3E%3C/g%3E%3Ccircle cx='24' cy='24' r='3' fill='%2334D399'/%3E%3C/svg%3E"
    />

    <!-- Rubik carries Hebrew properly at every weight; `display=swap` keeps
         first paint on the system stack instead of blocking on the network. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap"
    />

    <title>Smart Shift Management — שיבוץ משמרות חכם</title>

    <script>
      // Resolve the theme before the first paint. Without this a light-mode
      // user watches the app flash dark on every load, because the stylesheet
      // defaults to dark and React only mounts a frame later.
      // Mirrors applyMode() in src/hooks/useTheme.js — keep the two in step.
      (function () {
        try {
          var mode = localStorage.getItem("gs-theme");
          if (mode === "light" || mode === "dark") {
            document.documentElement.setAttribute("data-theme", mode);
          }
        } catch (e) {
          /* storage blocked — fall through to the media-query default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
