<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta
      name="description"
      content="Smart Shift Management — שיבוץ משמרות חכם לצוותי אבטחה. אלגוריתם שמכבד זמינות, שעות מנוחה והוגנות עומס, עם הסבר לכל החלטה."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<!-- The interlocking cycles. Mirrors LogoMark in src/components/Logo.jsx —
             keep in step. Served as a real file (not an inlined data URI) so
             Vercel's project-avatar crawler can fetch it. -->
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Rubik carries Hebrew properly at every weight; `display=swap` keeps
         first paint on the system stack instead of blocking on the network. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap"
    />

    <title>Smart Shift Management — שיבוץ משמרות חכם</title>

    <script>
      // Resolve the theme before the first paint. Without this a light-mode
      // user watches the app flash dark on every load, because the stylesheet
      // defaults to dark and React only mounts a frame later.
      // Mirrors applyMode() in src/hooks/useTheme.js — keep the two in step.
      (function () {
        try {
          var mode = localStorage.getItem("gs-theme");
          if (mode === "light" || mode === "dark") {
            document.documentElement.setAttribute("data-theme", mode);
          }
        } catch (e) {
          /* storage blocked — fall through to the media-query default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
